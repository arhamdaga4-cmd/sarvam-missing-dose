name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the offline test suite (no API keys required)
        run: python -m pytest -q
      - name: Smoke-test the CLI in offline mode
        run: python run_checkup.py P001 --offline
